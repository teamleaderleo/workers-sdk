name: Fieldwork 611 OAuth Callback Port Ownership

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-611-oauth-callback-port-ownership.yml"
      - "packages/workers-auth/tests/oauth-callback-port-ownership.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback-port-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
      - name: Verify exact evidence parent
        run: test "$(git rev-parse HEAD^1)" = "3a21291b28d819626628868a7e4018683a6e3671"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workers-auth with workspace dependencies
        run: pnpm run build --filter=@cloudflare/workers-auth...
      - name: Check focused test formatting
        run: pnpm exec oxfmt --check packages/workers-auth/tests/oauth-callback-port-ownership.test.ts
      - name: Run callback ownership control
        run: |
          pnpm --filter @cloudflare/workers-auth exec vitest run \
            tests/oauth-callback-port-ownership.test.ts
      - name: Verify test-only fence
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD | sort)
          expected=(
            .github/workflows/fieldwork-611-oauth-callback-port-ownership.yml
            packages/workers-auth/tests/oauth-callback-port-ownership.test.ts
          )
          test "${changed[*]}" = "${expected[*]}"
