name: Fieldwork Browser Timeout Experiment

on:
  push:
    branches:
      - fieldwork/browser-timeout-observability

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  windows-browser-timeouts:
    name: Windows browser timeout experiments
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build Miniflare test dependencies
        run: pnpm check:type --filter=miniflare

      - name: Verify per-test timeout overrides suite timeout
        shell: bash
        run: |
          cat > packages/miniflare/test/fieldwork-timeout-precedence.spec.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          describe("timeout precedence", { timeout: 100 }, () => {
            it("uses the explicit test timeout", { timeout: 1_000 }, async () => {
              await new Promise((resolve) => setTimeout(resolve, 250));
              expect(true).toBe(true);
            });
          });
          EOF
          pnpm -F miniflare test:ci test/fieldwork-timeout-precedence.spec.ts
          rm packages/miniflare/test/fieldwork-timeout-precedence.spec.ts

      - name: Inspect installed Puppeteer browser installer
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location packages/miniflare
          $entry = (& node -p "require.resolve('@puppeteer/browsers')").Trim()
          Pop-Location
          Write-Host "@puppeteer/browsers entry: $entry"
          $dir = Split-Path $entry
          Get-ChildItem $dir | Select-Object Name
          foreach ($file in @("install.js", "httpUtil.js")) {
            $path = Join-Path $dir $file
            if (Test-Path $path) {
              Write-Host "----- $file -----"
              Get-Content $path
            }
          }

      - name: Restore Chrome browser cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: fieldwork-chrome-${{ runner.os }}-${{ hashFiles('packages/miniflare/src/plugins/browser-rendering/browser-version.ts') }}
          path: |
            ~/.cache/.wrangler/chrome
            ~/Library/Caches/.wrangler/chrome
            ~/AppData/Local/xdg.cache/.wrangler/chrome

      - name: Apply observed-test timeout candidate
        run: node .fieldwork/browser-timeout-experiment.mjs test-policy

      - name: Show observed-test candidate
        shell: bash
        run: |
          git diff --check
          git diff -- packages/miniflare/test/plugins/browser/index.spec.ts

      - name: Type-check observed-test candidate with workspace dependencies
        run: pnpm check:type --filter=miniflare

      - name: Run Browser Rendering spec with observed-test candidate
        run: pnpm -F miniflare test:ci test/plugins/browser/index.spec.ts

      - name: Inject a slow browser launch
        run: node .fieldwork/browser-timeout-experiment.mjs fault-injection

      - name: Rebuild Miniflare with injected browser delay
        run: pnpm -F miniflare build

      - name: Verify named acquisition deadline beats outer Vitest timeout
        continue-on-error: true
        shell: pwsh
        env:
          FIELDWORK_BROWSER_LAUNCH_DELAY_MS: "5000"
          FIELDWORK_BROWSER_REQUEST_TIMEOUT_MS: "2000"
          FIELDWORK_BROWSER_TEST_TIMEOUT_MS: "6000"
        run: |
          & pnpm -F miniflare test:ci test/plugins/browser/index.spec.ts -t "it creates a browser session" *> fieldwork-timeout.log
          $exitCode = $LASTEXITCODE
          $output = Get-Content fieldwork-timeout.log -Raw
          Write-Host $output
          if ($exitCode -eq 0) {
            throw "Expected the injected slow launch to exceed the acquisition deadline."
          }
          if ($output -notmatch "Browser session acquisition timed out") {
            throw "Expected a phase-specific browser session acquisition timeout."
          }
          if ($output -match "Test timed out in 6000ms") {
            throw "Outer Vitest timeout fired before the acquisition-owned deadline."
          }

      - name: Reset experiment source edits
        if: always()
        shell: bash
        run: |
          git checkout -- packages/miniflare/test/plugins/browser/index.spec.ts
          git checkout -- packages/miniflare/src/plugins/browser-rendering/index.ts

      - name: Apply BrowserSession connect-deadline candidate
        if: always()
        run: node .fieldwork/browser-timeout-experiment.mjs connect-deadline

      - name: Show connect-deadline candidate
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff -- packages/miniflare/src/workers/browser-rendering/binding.worker.ts

      - name: Type-check connect-deadline candidate with workspace dependencies
        if: always()
        run: pnpm check:type --filter=miniflare

      - name: Run Browser Rendering spec with connect-deadline candidate
        if: always()
        run: pnpm -F miniflare test:ci test/plugins/browser/index.spec.ts
