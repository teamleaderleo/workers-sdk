name: Fieldwork Unit 15 Focused Execution

# Canonical source under test: d3ca9ad275e0cc93f985bb7485a776cec023d4ca
on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-unit15-focused-v2.yml"
      - ".github/fieldwork/miniflare-first-call-wait.patch"
      - "packages/miniflare/**"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniflare-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact canonical source base
        run: test "$(git rev-parse HEAD^1)" = "d3ca9ad275e0cc93f985bb7485a776cec023d4ca"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply first-call wait candidate
        run: |
          git apply --check .github/fieldwork/miniflare-first-call-wait.patch
          git apply .github/fieldwork/miniflare-first-call-wait.patch
      - name: Run focused teardown lifecycle controls
        run: pnpm --filter miniflare test -- teardown-lifecycle.spec.ts
      - name: Run Miniflare type check
        run: pnpm --filter miniflare check:type
