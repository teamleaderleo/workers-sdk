name: Fieldwork Unit 15 Focused Execution

# Canonical source under test: d3ca9ad275e0cc93f985bb7485a776cec023d4ca
on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-unit15-focused-v2.yml"
      - "packages/miniflare/**"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniflare-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact canonical source base
        run: test "$(git rev-parse HEAD^1)" = "d3ca9ad275e0cc93f985bb7485a776cec023d4ca"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize first-call wait candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path('packages/miniflare/src/index.ts')
          source = source_path.read_text(encoding='utf-8')
          old = dedent('''\
                      // Cleanup as much as possible even if `#init()` threw.
                      await this.#closeBrowserProcesses();
                      await this.#proxyClient?.dispose();
                      await runtimeDisposePromise;
          ''')
          new = dedent('''\
                      // Cleanup as much as possible even if `#init()` threw.
                      let earlyCleanupFailed = false;
                      let earlyCleanupError: unknown;
                      try {
                        await this.#closeBrowserProcesses();
                        await this.#proxyClient?.dispose();
                      } catch (error) {
                        earlyCleanupFailed = true;
                        earlyCleanupError = error;
                      }

                      try {
                        await runtimeDisposePromise;
                      } catch (error) {
                        if (!earlyCleanupFailed) throw error;
                      }
                      if (earlyCleanupFailed) {
                        throw earlyCleanupError;
                      }
          ''')
          if source.count(old) != 1:
              raise SystemExit(f'expected one cleanup boundary, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('packages/miniflare/test/teardown-lifecycle.spec.ts')
          test = test_path.read_text(encoding='utf-8')
          addition = dedent('''\

          test("Miniflare: first dispose waits for workerd exit after proxy cleanup rejects", async ({ expect }) => {
            const mf = await createReadyMiniflare();
            const proxyDispose = vi
              .spyOn(ProxyClient.prototype, "dispose")
              .mockRejectedValueOnce(new Error("injected proxy cleanup failure"));
            const originalKill = childProcess.ChildProcess.prototype.kill;
            let killedWorkerd: childProcess.ChildProcess | undefined;
            const kill = vi
              .spyOn(childProcess.ChildProcess.prototype, "kill")
              .mockImplementation(function (
                this: childProcess.ChildProcess,
                signal?: number | NodeJS.Signals
              ) {
                if (
                  signal === "SIGKILL" &&
                  path.basename(this.spawnfile).toLowerCase().startsWith("workerd")
                ) {
                  killedWorkerd = this;
                  return true;
                }
                return originalKill.call(this, signal);
              });

            const firstDispose = mf.dispose();
            await vi.waitFor(() => expect(killedWorkerd).toBeDefined());
            let firstDisposeSettled = false;
            void firstDispose
              .finally(() => {
                firstDisposeSettled = true;
              })
              .catch(() => {});
            await new Promise(resolve => setTimeout(resolve, 50));
            expect(firstDisposeSettled).toBe(false);

            if (killedWorkerd !== undefined) {
              originalKill.call(killedWorkerd, "SIGKILL");
              await waitForChildExit(killedWorkerd);
            }
            await expect(firstDispose).rejects.toThrow(
              "injected proxy cleanup failure"
            );

            kill.mockRestore();
            proxyDispose.mockRestore();
            await mf.dispose().catch(() => {});
          });
          ''')
          if 'first dispose waits for workerd exit' in test:
              raise SystemExit('first-call wait test already exists')
          test_path.write_text(test.rstrip() + addition, encoding='utf-8')
          PY

      - name: Format candidate files
        run: |
          pnpm exec oxfmt --write \
            packages/miniflare/src/index.ts \
            packages/miniflare/test/teardown-lifecycle.spec.ts
      - name: Run focused teardown lifecycle controls
        run: pnpm --filter miniflare test -- teardown-lifecycle.spec.ts
      - name: Run Miniflare type check
        run: pnpm --filter miniflare check:type
      - name: Verify exact two-file fence
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            packages/miniflare/src/index.ts
            packages/miniflare/test/teardown-lifecycle.spec.ts
          )
          test "${changed[*]}" = "${expected[*]}"
