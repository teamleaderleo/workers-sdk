name: Fieldwork Format Receipt

on:
  push:
    branches:
      - fieldwork/auth-authority-reproductions

permissions:
  contents: read

jobs:
  format-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/install-dependencies
        with:
          node-version: "22.23.1"
      - name: Format target files and print diff
        run: |
          pnpm exec oxfmt \
            packages/deploy-helpers/tests/context-ownership.test.ts \
            packages/workers-auth/src/operation-authority.test.ts
          git diff -- \
            packages/deploy-helpers/tests/context-ownership.test.ts \
            packages/workers-auth/src/operation-authority.test.ts
