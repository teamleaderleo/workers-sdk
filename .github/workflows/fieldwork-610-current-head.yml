name: Fieldwork 610 current-head gates

on:
  push:
    branches:
      - carrier/610-whoami-refresh-run

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build Wrangler dependency graph
        run: pnpm exec turbo run build --filter=wrangler
      - name: Focused whoami auth-state test
        run: pnpm --filter wrangler exec vitest run src/__tests__/whoami-active-token-permissions.test.ts
      - name: Wrangler type-check
        run: pnpm exec turbo run check:type --filter=wrangler
      - name: Wrangler lint
        run: pnpm exec turbo run check:lint --filter=wrangler
