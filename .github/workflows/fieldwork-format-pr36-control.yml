name: Fieldwork format PR 36 control

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.number == 36
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fieldwork/dev-log-level-session-scope-candidate
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec oxfmt
          packages/wrangler/src/__tests__/dev/start-dev.test.ts
          packages/wrangler/src/api/startDevWorker/DevEnv.ts
          packages/wrangler/src/dev/start-dev.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/wrangler/src/__tests__/dev/start-dev.test.ts packages/wrangler/src/api/startDevWorker/DevEnv.ts packages/wrangler/src/dev/start-dev.ts
          git commit -m "style(wrangler): apply repository formatter"
          git push origin HEAD:fieldwork/dev-log-level-session-scope-candidate
