name: Fieldwork 656 Access Probe Failure Retry

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-656-access-probe-failure-retry.yml"
      - "fieldwork-patches/656-access-probe-failure-retry.patch"
      - "packages/workers-auth/src/access.ts"
      - "packages/workers-auth/tests/access-probe-failure-cache.test.ts"
      - "packages/workers-auth/package.json"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-probe-failure-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact evidence parent
        run: test "$(git rev-parse HEAD^1)" = "99eb50ce1d3420a50ae0e95958bf49d65874706e"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check committed regression formatting
        run: pnpm exec oxfmt --check packages/workers-auth/tests/access-probe-failure-cache.test.ts
      - name: Build baseline with workspace dependencies
        run: pnpm run build --filter=@cloudflare/workers-auth...
      - name: Require focused baseline assertion failure
        run: |
          set +e
          FORCE_COLOR=0 pnpm --filter @cloudflare/workers-auth exec vitest run \
            tests/access-probe-failure-cache.test.ts \
            2>&1 | tee baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "AssertionError" baseline.log
          ! grep -F "Failed Suites" baseline.log
      - name: Apply retained candidate with zero fuzz
        run: |
          git apply --check --whitespace=error-all \
            fieldwork-patches/656-access-probe-failure-retry.patch
          git apply --whitespace=error-all \
            fieldwork-patches/656-access-probe-failure-retry.patch
      - name: Check candidate formatting
        run: |
          pnpm exec oxfmt --check \
            packages/workers-auth/src/access.ts \
            packages/workers-auth/tests/access-probe-failure-cache.test.ts
      - name: Build candidate with workspace dependencies
        run: pnpm run build --filter=@cloudflare/workers-auth...
      - name: Typecheck candidate with workspace dependencies
        run: pnpm run check:type --filter=@cloudflare/workers-auth...
      - name: Require focused candidate to pass
        run: |
          pnpm --filter @cloudflare/workers-auth exec vitest run \
            tests/access-probe-failure-cache.test.ts
      - name: Verify exact source fence
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(packages/workers-auth/src/access.ts)
          test "${changed[*]}" = "${expected[*]}"
