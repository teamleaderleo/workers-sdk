name: Fieldwork unit 15 focused checks

on:
  push:
    branches:
      - fieldwork/unit15-focused-execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run focused lifecycle controls
        run: pnpm --filter miniflare test -- teardown-lifecycle.spec.ts
      - name: Run Miniflare type check
        run: pnpm --filter miniflare check:type
