name: Fieldwork Browser Session Timeout Refined Validation

on:
  push:
    branches:
      - fieldwork/browser-session-timeout-refined-validation

permissions:
  contents: read

jobs:
  windows:
    name: Windows refined Candidate A validation
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore Chrome browser cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: fieldwork-refined-a-chrome-${{ runner.os }}-${{ hashFiles('packages/miniflare/src/plugins/browser-rendering/browser-version.ts') }}
          path: |
            ~/.cache/.wrangler/chrome
            ~/Library/Caches/.wrangler/chrome
            ~/AppData/Local/xdg.cache/.wrangler/chrome

      - name: Verify exact refined Candidate A source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "a97c23fb20206d4ff21a0d4e366b7ff899d8a539"
          git diff --exit-code a97c23fb20206d4ff21a0d4e366b7ff899d8a539 -- packages/miniflare/test/plugins/browser/index.spec.ts
          test "$(git diff --name-only 49f73de207124171b3f8e9ffb182facb48727388 a97c23fb20206d4ff21a0d4e366b7ff899d8a539)" = "packages/miniflare/test/plugins/browser/index.spec.ts"
          git diff --check 49f73de207124171b3f8e9ffb182facb48727388 a97c23fb20206d4ff21a0d4e366b7ff899d8a539
          pnpm exec oxfmt --check packages/miniflare/test/plugins/browser/index.spec.ts
          grep -F 'describe.sequential("browser rendering", { timeout: 20_000 }' packages/miniflare/test/plugins/browser/index.spec.ts
          grep -F 'const BROWSER_SESSION_ACQUIRE_TIMEOUT_MS = 60_000;' packages/miniflare/test/plugins/browser/index.spec.ts
          grep -F 'const BROWSER_SESSION_TEST_TIMEOUT_MS = 75_000;' packages/miniflare/test/plugins/browser/index.spec.ts
          grep -F 'Browser session acquisition failed with ${res.status} ${res.statusText}' packages/miniflare/test/plugins/browser/index.spec.ts
          grep -F 'status: newBrowserSession.status' packages/miniflare/test/plugins/browser/index.spec.ts
          grep -F 'expect(text).toContain("sessionId")' packages/miniflare/test/plugins/browser/index.spec.ts

      - name: Type-check exact refined Candidate A
        run: pnpm check:type --filter=miniflare

      - name: Run full Browser Rendering spec
        run: pnpm -F miniflare test:ci test/plugins/browser/index.spec.ts

      - name: Run healthy acquisition twice
        shell: pwsh
        run: |
          $durations = @()
          for ($i = 1; $i -le 2; $i++) {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            & pnpm -F miniflare test:ci test/plugins/browser/index.spec.ts -t "it creates a browser session"
            if ($LASTEXITCODE -ne 0) {
              throw "Healthy acquisition repetition $i failed."
            }
            $sw.Stop()
            $durations += [math]::Round($sw.Elapsed.TotalSeconds, 2)
          }
          Write-Host "Refined Candidate A healthy acquisition wall times (s): $($durations -join ', ')"

      - name: Save exact candidate test file
        shell: pwsh
        run: |
          Copy-Item packages/miniflare/test/plugins/browser/index.spec.ts "$env:RUNNER_TEMP/candidate-index.spec.ts"
          $hash = git hash-object packages/miniflare/test/plugins/browser/index.spec.ts
          "CANDIDATE_TEST_BLOB=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Refined Candidate A test blob: $hash"

      - name: Inject synthetic inner 503 response
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = "packages/miniflare/test/plugins/browser/index.spec.ts";
          let source = fs.readFileSync(path, "utf8");
          const oldLine = '\t\t\tconst newBrowserSession = await env.MYBROWSER.fetch("https://localhost/v1/acquire")';
          const newLine = '\t\t\tconst newBrowserSession = new Response("FIELDWORK inner browser failure", { status: 503, statusText: "Injected Failure" })';
          if (!source.includes(oldLine)) throw new Error("inner binding fetch marker missing");
          source = source.replace(oldLine, newLine);
          fs.writeFileSync(path, source);

      - name: Prove inner status and body remain visible
        shell: pwsh
        run: |
          & pnpm -F miniflare test:ci test/plugins/browser/index.spec.ts -t "it creates a browser session" *> "$env:RUNNER_TEMP/fieldwork-inner-503.log"
          $testExit = $LASTEXITCODE
          $output = Get-Content "$env:RUNNER_TEMP/fieldwork-inner-503.log" -Raw
          Write-Host $output
          if ($testExit -eq 0) {
            throw "Expected synthetic inner 503 acquisition to fail."
          }
          if ($output -notmatch "Browser session acquisition failed with 503 Injected Failure") {
            throw "Expected preserved 503 status/statusText."
          }
          if ($output -notmatch "FIELDWORK inner browser failure") {
            throw "Expected preserved inner response body."
          }
          if ($output -match "expected false to be true") {
            throw "Old boolean assertion masking is still present."
          }
          if ($output -match "Test timed out") {
            throw "Synthetic 503 proof was masked by a generic test timeout."
          }
          $global:LASTEXITCODE = 0

      - name: Restore exact candidate after synthetic fault
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP/candidate-index.spec.ts" packages/miniflare/test/plugins/browser/index.spec.ts -Force
          $hash = git hash-object packages/miniflare/test/plugins/browser/index.spec.ts
          if ($hash -ne $env:CANDIDATE_TEST_BLOB) {
            throw "Candidate test file changed during synthetic fault proof."
          }

      - name: Inject deterministic 65s browser launch stall
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = "packages/miniflare/src/plugins/browser-rendering/index.ts";
          let source = fs.readFileSync(path, "utf8");
          const marker = `}) {\n\tconst platform = detectBrowserPlatform();`;
          if (!source.includes(marker)) throw new Error("launchBrowser marker missing");
          source = source.replace(
            marker,
            `}) {\n\tawait new Promise((resolve) => setTimeout(resolve, 65_000));\n\tconst platform = detectBrowserPlatform();`
          );
          fs.writeFileSync(path, source);

      - name: Rebuild Miniflare with launch stall
        run: pnpm -F miniflare build

      - name: Prove acquisition deadline beats outer watchdog
        shell: pwsh
        run: |
          & pnpm -F miniflare test:ci test/plugins/browser/index.spec.ts -t "it creates a browser session" *> "$env:RUNNER_TEMP/fieldwork-acquisition-timeout.log"
          $testExit = $LASTEXITCODE
          $output = Get-Content "$env:RUNNER_TEMP/fieldwork-acquisition-timeout.log" -Raw
          Write-Host $output
          if ($testExit -eq 0) {
            throw "Expected injected 65s launch stall to exceed the 60s acquisition deadline."
          }
          if ($output -notmatch "Browser session acquisition timed out after 60000ms") {
            throw "Expected named 60s browser session acquisition timeout."
          }
          if ($output -match "Test timed out in 75000ms") {
            throw "Outer 75s Vitest watchdog fired before the acquisition-owned deadline."
          }
          $global:LASTEXITCODE = 0
