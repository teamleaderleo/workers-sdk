name: Fieldwork 471 Account Cache Revalidation

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-471-account-cache-revalidation.yml"
      - "fieldwork-patches/471-account-cache-validation.patch"
      - "packages/workers-auth/src/core/factory.ts"
      - "packages/wrangler/src/__tests__/account-cache-credential-authority.test.ts"
      - "packages/workers-auth/package.json"
      - "packages/wrangler/package.json"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-cache-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact evidence parent
        run: test "$(git rev-parse HEAD^1)" = "8d759fe13b1ebb5050dda6d20355c879817d9ea4"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build baseline with workspace dependencies
        run: pnpm run build --filter=wrangler...
      - name: Require focused baseline assertion failure
        run: |
          set +e
          FORCE_COLOR=0 pnpm --filter wrangler exec vitest run \
            src/__tests__/account-cache-credential-authority.test.ts 2>&1 | tee baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "AssertionError" baseline.log
          ! grep -F "Failed Suites" baseline.log
      - name: Apply retained candidate with zero fuzz
        run: |
          git apply --check --whitespace=error-all \
            fieldwork-patches/471-account-cache-validation.patch
          git apply --whitespace=error-all \
            fieldwork-patches/471-account-cache-validation.patch
      - name: Check formatting
        run: |
          pnpm exec oxfmt --check \
            packages/workers-auth/src/core/factory.ts \
            packages/wrangler/src/__tests__/account-cache-credential-authority.test.ts
      - name: Build candidate with workspace dependencies
        run: pnpm run build --filter=wrangler...
      - name: Typecheck candidate with workspace dependencies
        run: pnpm run check:type --filter=wrangler...
      - name: Require focused candidate to pass
        run: |
          pnpm --filter wrangler exec vitest run \
            src/__tests__/account-cache-credential-authority.test.ts
      - name: Verify exact source fence
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(packages/workers-auth/src/core/factory.ts)
          test "${changed[*]}" = "${expected[*]}"
