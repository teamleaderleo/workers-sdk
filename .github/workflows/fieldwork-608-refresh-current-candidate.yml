name: Fieldwork 608 Refresh Current Candidate

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-608-refresh-current-candidate.yml"
      - "fieldwork-patches/608-refresh-account-discovery-singleflight-current.patch"
      - "packages/workers-auth/tests/refresh-singleflight.test.ts"
      - "packages/workers-auth/tests/fetch-all-accounts-credential-snapshot.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-singleflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
      - name: Verify exact evidence parent
        run: test "$(git rev-parse HEAD^1)" = "2e4a2b2c9f4f402497864448f09d8fd14fae62c1"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build baseline with workspace dependencies
        run: pnpm run build --filter=@cloudflare/workers-auth...
      - name: Require focused baseline assertion failures
        run: |
          set +e
          FORCE_COLOR=0 pnpm --filter @cloudflare/workers-auth exec vitest run \
            tests/refresh-singleflight.test.ts \
            tests/fetch-all-accounts-credential-snapshot.test.ts \
            2>&1 | tee baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "AssertionError" baseline.log
          ! grep -F "Failed Suites" baseline.log
      - name: Apply retained candidate with zero fuzz
        run: |
          git apply --check --whitespace=error-all \
            fieldwork-patches/608-refresh-account-discovery-singleflight-current.patch
          git apply --whitespace=error-all \
            fieldwork-patches/608-refresh-account-discovery-singleflight-current.patch
      - name: Check candidate formatting
        run: |
          pnpm exec oxfmt --check \
            packages/workers-auth/src/flow.ts \
            packages/workers-auth/src/core/factory.ts \
            packages/workers-auth/tests/refresh-singleflight.test.ts \
            packages/workers-auth/tests/fetch-all-accounts-credential-snapshot.test.ts
      - name: Build candidate with workspace dependencies
        run: pnpm run build --filter=@cloudflare/workers-auth...
      - name: Typecheck candidate with workspace dependencies
        run: pnpm run check:type --filter=@cloudflare/workers-auth...
      - name: Require focused candidate to pass
        run: |
          pnpm --filter @cloudflare/workers-auth exec vitest run \
            tests/refresh-singleflight.test.ts \
            tests/fetch-all-accounts-credential-snapshot.test.ts
      - name: Verify exact source fence
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            packages/workers-auth/src/core/factory.ts
            packages/workers-auth/src/flow.ts
          )
          test "${changed[*]}" = "${expected[*]}"
