name: Fieldwork 611 OAuth Attempt Current

on:
  pull_request:
    paths:
      - ".github/workflows/fieldwork-611-oauth-attempt-current.yml"
      - "fieldwork-patches/611-oauth-login-attempt-isolation-current.patch"
      - "packages/workers-auth/tests/oauth-login-attempt-isolation.test.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oauth-attempt-isolation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/611-oauth-attempt-current-exec
          fetch-depth: 0
      - name: Verify exact evidence ancestry
        run: test "$(git merge-base HEAD 3a21291b28d819626628868a7e4018683a6e3671)" = "3a21291b28d819626628868a7e4018683a6e3671"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build baseline with workspace dependencies
        run: pnpm run build --filter=@cloudflare/workers-auth...
      - name: Require focused baseline assertion failure
        run: |
          set +e
          FORCE_COLOR=0 pnpm --filter @cloudflare/workers-auth exec vitest run \
            tests/oauth-login-attempt-isolation.test.ts \
            2>&1 | tee baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "AssertionError" baseline.log
          ! grep -F "Failed Suites" baseline.log
      - name: Apply retained candidate with zero fuzz
        run: |
          git apply --check --whitespace=error-all \
            fieldwork-patches/611-oauth-login-attempt-isolation-current.patch
          git apply --whitespace=error-all \
            fieldwork-patches/611-oauth-login-attempt-isolation-current.patch
      - name: Check formatting
        run: |
          pnpm exec oxfmt --check \
            packages/workers-auth/src/flow.ts \
            packages/workers-auth/tests/oauth-login-attempt-isolation.test.ts
      - name: Build candidate with workspace dependencies
        run: pnpm run build --filter=@cloudflare/workers-auth...
      - name: Typecheck candidate with workspace dependencies
        run: pnpm run check:type --filter=@cloudflare/workers-auth...
      - name: Require focused candidate to pass
        run: |
          pnpm --filter @cloudflare/workers-auth exec vitest run \
            tests/oauth-login-attempt-isolation.test.ts
      - name: Verify exact source fence
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(packages/workers-auth/src/flow.ts)
          test "${changed[*]}" = "${expected[*]}"
      - name: Publish validated source to owned execution branch
        run: |
          git add packages/workers-auth/src/flow.ts
          test "$(git diff --cached --name-only)" = 'packages/workers-auth/src/flow.ts'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(workers-auth): isolate OAuth login attempt state'
          git push origin HEAD:fieldwork/611-oauth-attempt-current-exec
