name: Fieldwork observability NaN repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fieldwork/665-observability-nan-repro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Apply exact repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/workers-utils/src/config/validation.ts')
          text = path.read_text()
          old = 'if (samplingRate && (samplingRate < 0 || samplingRate > 1)) {'
          new = '''if (\n\t\tsamplingRate !== undefined &&\n\t\t(!Number.isFinite(samplingRate) || samplingRate < 0 || samplingRate > 1)\n\t) {'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one sampling-rate guard, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- packages/workers-utils/src/config/validation.ts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused workers-utils control
        run: pnpm --filter @cloudflare/workers-utils test:ci -- tests/config/validation/observability-sampling-rate.test.ts
      - name: Run focused typecheck and format
        run: |
          pnpm --filter @cloudflare/workers-utils check:type
          pnpm exec oxfmt --check packages/workers-utils/src/config/validation.ts packages/workers-utils/tests/config/validation/observability-sampling-rate.test.ts
      - name: Publish repaired source and remove carrier
        run: |
          rm .github/workflows/fieldwork-665-observability-nan-repair.yml
          git add packages/workers-utils/src/config/validation.ts .github/workflows/fieldwork-665-observability-nan-repair.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/fieldwork-665-observability-nan-repair.yml\npackages/workers-utils/src/config/validation.ts'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: reject non-finite observability sampling rates'
          git push origin HEAD:fieldwork/665-observability-nan-repro
