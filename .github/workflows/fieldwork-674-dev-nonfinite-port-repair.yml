name: Fieldwork 674 Dev Non-Finite Port Repair

on:
  pull_request:

permissions:
  contents: read

jobs:
  dev-port-finite-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
      - name: Verify exact characterization parent
        run: test "$(git rev-parse HEAD^1)" = "c44d413784115884192c002222061956a5bab616"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.1'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Build baseline dependency closure
        run: pnpm run build --filter=@cloudflare/workers-utils...
      - name: Require finite-port baseline assertion failure
        run: |
          set +e
          FORCE_COLOR=0 pnpm --filter @cloudflare/workers-utils exec vitest run \
            tests/config/validation/dev-nonfinite-port-repair.test.ts \
            2>&1 | tee baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "AssertionError" baseline.log
          ! grep -F "Failed Suites" baseline.log
      - name: Apply narrow finite-port candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/workers-utils/src/config/validation.ts')
          text = path.read_text()
          old = '''\tvalidateOptionalProperty(diagnostics, "dev", "ip", ip, "string");\n\tvalidateOptionalProperty(diagnostics, "dev", "port", port, "number");\n\tvalidateOptionalProperty(\n\t\tdiagnostics,\n\t\t"dev",\n\t\t"inspector_port",\n\t\tinspector_port,\n\t\t"number"\n\t);'''
          new = '''\tvalidateOptionalProperty(diagnostics, "dev", "ip", ip, "string");\n\tif (\n\t\tvalidateOptionalProperty(diagnostics, "dev", "port", port, "number") &&\n\t\tport !== undefined &&\n\t\t!Number.isFinite(port)\n\t) {\n\t\tdiagnostics.errors.push(`"dev.port" must be a finite number.`);\n\t}\n\tif (\n\t\tvalidateOptionalProperty(\n\t\t\tdiagnostics,\n\t\t\t"dev",\n\t\t\t"inspector_port",\n\t\t\tinspector_port,\n\t\t\t"number"\n\t\t) &&\n\t\tinspector_port !== undefined &&\n\t\t!Number.isFinite(inspector_port)\n\t) {\n\t\tdiagnostics.errors.push(`"dev.inspector_port" must be a finite number.`);\n\t}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one dev port validation block, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'packages/workers-utils/src/config/validation.ts'
      - name: Check candidate formatting
        run: pnpm exec oxfmt --check packages/workers-utils/src/config/validation.ts packages/workers-utils/tests/config/validation/dev-nonfinite-port-repair.test.ts
      - name: Build and typecheck candidate
        run: |
          pnpm run build --filter=@cloudflare/workers-utils...
          pnpm run check:type --filter=@cloudflare/workers-utils...
      - name: Require finite-port candidate to pass
        run: |
          pnpm --filter @cloudflare/workers-utils exec vitest run \
            tests/config/validation/dev-nonfinite-port-repair.test.ts
      - name: Verify exact runtime source fence
        run: test "$(git diff --name-only)" = 'packages/workers-utils/src/config/validation.ts'
